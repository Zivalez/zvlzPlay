name: Build

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 $GITHUB_WORKSPACE/builds/plugins.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson --console=plain 2>&1 | tee $GITHUB_WORKSPACE/build_log.txt
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_log.txt
          path: ${{ github.workspace }}/build_log.txt

      - name: Generate repo.json
        run: |
          echo '{"name":"zvlzPlay","description":"🇮🇩 Indonesian Movie & Series Repository for CloudStream","iconUrl":"https://public-assets.zvlz.my.id/cloudstream/zvlz_icon.avif","manifestVersion":1,"pluginLists":["https://raw.githubusercontent.com/Zivalez/zvlzPlay/builds/plugins.json"]}' | python3 -m json.tool > $GITHUB_WORKSPACE/builds/repo.json

      - name: Process plugins.json
        run: |
          cat <<EOF > process_plugins.py
          import json
          import os
          
          path = os.environ["GITHUB_WORKSPACE"] + "/builds/plugins.json"
          try:
              with open(path, "r") as f:
                  plugins = json.load(f)
              
              for plugin in plugins:
                  # Remove jar fields if they exist
                  plugin.pop("jarUrl", None)
                  plugin.pop("jarFileSize", None)
              
              with open(path, "w") as f:
                  json.dump(plugins, f, indent=4)
          except Exception as e:
              print(f"Error processing plugins.json: {e}")
          EOF
          python3 process_plugins.py

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push
